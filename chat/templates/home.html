<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <style>
        body {
            font-family: Arial;
            background: #ece5dd;
        }

        #chat-container {
            width: 400px;
            margin: auto;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
        }

        #box {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #e5ddd5;
            border-radius: 10px;
        }

        .msg {
            margin: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 70%;
        }

        .me {
            background: #dcf8c6;
            margin-left: auto;
            text-align: right;
        }

        .other {
            background: #fff;
        }

        #input-area {
            margin-top: 10px;
            display: flex;
        }

        #msg {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div id="chat-container">
    <h3>💬 Chat</h3>

    <input id="username" placeholder="Your name"><br><br>

    <div id="box">
        {% for msg in messages %}
            <div class="msg other">
                <b>{{ msg.username }}</b><br>
                {{ msg.content }}
            </div>
        {% endfor %}
    </div>

    <div id="input-area">
        <input id="msg" placeholder="Type message">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
let socket = new WebSocket("ws://" + window.location.host + "/ws/chat/");

socket.onmessage = function(event) {
    let data = JSON.parse(event.data);

    let msgDiv = document.createElement("div");
    msgDiv.classList.add("msg", "other");

    msgDiv.innerHTML = "<b>" + data.username + "</b><br>" + data.message;

    document.getElementById("box").appendChild(msgDiv);
};

function sendMessage() {
    let msg = document.getElementById("msg").value;
    let username = document.getElementById("username").value;

    let msgDiv = document.createElement("div");
    msgDiv.classList.add("msg", "me");

    msgDiv.innerHTML = "<b>You</b><br>" + msg;
    document.getElementById("box").appendChild(msgDiv);

    socket.send(JSON.stringify({
        'message': msg,
        'username': username
    }));

    document.getElementById("msg").value = "";
}
</script>

</body>
</html>
